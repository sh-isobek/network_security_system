# Barcha "engine" xizmatlari bir xil naqsh bo'yicha quriladi: bitta
# Docker image (loyihaning Dockerfile'idan), faqat `command` farq qiladi.
# Bularning barchasi STATELESS (holatsiz) - baza orqali muvofiqlashadi,
# shuning uchun `replicas`ni oshirish orqali osongina gorizontal
# miqyoslash mumkin (yangi TZ 21-bo'lim).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser-engine
  namespace: network-security
spec:
  replicas: 1
  selector:
    matchLabels: {app: parser-engine}
  template:
    metadata:
      labels: {app: parser-engine}
    spec:
      containers:
        - name: parser-engine
          image: ghcr.io/your-org/network-security-system:latest
          command: ["python", "-m", "engine.parser_engine", "--loop", "--interval", "5"]
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-analysis-engine
  namespace: network-security
spec:
  replicas: 2   # gorizontal miqyoslash namunasi - navbat-asosida ishlagani uchun xavfsiz
  selector:
    matchLabels: {app: file-analysis-engine}
  template:
    metadata:
      labels: {app: file-analysis-engine}
    spec:
      containers:
        - name: file-analysis-engine
          image: ghcr.io/your-org/network-security-system:latest
          command: ["python", "-m", "engine.file_analysis_engine", "--loop", "--interval", "10"]
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deep-scan-engine
  namespace: network-security
spec:
  replicas: 2
  selector:
    matchLabels: {app: deep-scan-engine}
  template:
    metadata:
      labels: {app: deep-scan-engine}
    spec:
      containers:
        - name: deep-scan-engine
          image: ghcr.io/your-org/network-security-system:latest
          command: ["python", "-m", "engine.deep_scan_engine", "--loop", "--interval", "10"]
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
          volumeMounts:
            - name: clamav-db
              mountPath: /var/lib/clamav
            - name: suricata-files
              mountPath: /var/log/suricata/files
              readOnly: true
          resources:
            requests: {cpu: "200m", memory: "256Mi"}
            limits: {cpu: "1", memory: "1Gi"}
      volumes:
        - name: clamav-db
          persistentVolumeClaim: {claimName: clamav-db-pvc}
        - name: suricata-files
          hostPath: {path: /var/log/suricata/files, type: DirectoryOrCreate}
---
