<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>MFA tasdiqlash - Xavfsizlik Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body class="auth-page">
    <div class="card">
        <div class="auth-brand">
            <span class="brand-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6.2v5.4c0 4.6 3.4 8.4 8 9.4 4.6-1 8-4.8 8-9.4V6.2L12 3Z"/><path d="M9 12.2l2.1 2.1L15.2 10"/></svg>
            </span>
            NETGUARD
        </div>

        <h1>Ikki bosqichli tasdiqlash</h1>
        <p class="subtitle">Autentifikator ilovangizdagi 6 xonali kodni kiriting.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="mfa-code" class="sr-only">Tasdiqlash kodi</label>
            <input id="mfa-code" class="mfa-code" type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus>
            <button class="btn btn-primary" type="submit">Tasdiqlash</button>
        </form>
    </div>
</body>
</html>
