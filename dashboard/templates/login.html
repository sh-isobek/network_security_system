<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Kirish - Xavfsizlik Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body class="auth-page">
    <div class="card">
        <div class="auth-brand">
            <span class="brand-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6.2v5.4c0 4.6 3.4 8.4 8 9.4 4.6-1 8-4.8 8-9.4V6.2L12 3Z"/><path d="M9 12.2l2.1 2.1L15.2 10"/></svg>
            </span>
            NETGUARD
        </div>

        <div class="auth-language language-switcher" aria-label="Interfeys tili">
            <span>Til / Язык</span>
            <div>
                <a href="{{ language_url('uz') }}" class="{% if interface_language == 'uz' %}active{% endif %}">UZ</a>
                <a href="{{ language_url('ru') }}" class="{% if interface_language == 'ru' %}active{% endif %}">RU</a>
            </div>
        </div>

        <h1>Xush kelibsiz</h1>
        <p class="subtitle">Kirish uchun login va parolingizni kiriting.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="username">Login</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">Parol</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button class="btn btn-primary" type="submit">Kirish</button>
        </form>
    </div>
</body>
</html>
