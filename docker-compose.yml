volumes:
  postgres_data:
  clamav_db:
  grafana_data:
  quarantine_data:
  # Diqqat: Suricata odatda SPAN port orqali xom tarmoq trafigini o'qishi
  # kerak bo'lgani uchun konteynerdan tashqarida, host'da alohida ishlaydi
  # (docs_SURICATA_SETUP.md'ga qarang). Uning file-store papkasi
  # (/var/log/suricata/files) deep_scan_engine xizmatiga pastda bind-mount
  # orqali (named volume emas) bog'langan.

services:
  # ---------------------------------------------------------------------
  # Ma'lumotlar bazasi
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-security_system}
      POSTGRES_USER: ${POSTGRES_USER:-security_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida majburiy}
    ports:
      # Faqat 127.0.0.1'ga bog'langan (tashqi tarmoqqa OCHIQ EMAS) -
      # bu `network_discovery` xizmati kabi `network_mode: host`
      # konteynerlariga host orqali ulanish imkonini beradi.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-security_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # 0-bosqich: Syslog qabul qiluvchi (Kerio/switch/DNS forwarder shu yerga yuboradi)
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # Queue (yangi TZ 17-bo'lim) - yuqori yuklama uchun ixtiyoriy
  # ---------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP protokoli
      - "15672:15672"  # Web boshqaruv paneli (http://localhost:15672)
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Standart syslog_collector (yuqorida) o'rniga ishlatiladigan
  # navbat-asosli variant - juda yuqori UDP trafik kutilganda tavsiya
  # etiladi (docs_DOCKER_DEPLOYMENT.md'dagi "Kengaytirish" bo'limiga qarang)
  syslog_collector_queued:
    build: .
    restart: unless-stopped
    command: python -m collectors.syslog_server_queued
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    ports:
      - "515:5140/udp"  # standart syslog_collector bilan bir vaqtda sinash uchun boshqa port
    profiles: ["queue"]  # standart holatda ishga tushmaydi: docker compose --profile queue up
    depends_on:
      rabbitmq:
        condition: service_healthy

  queue_ingest_worker:
    build: .
    restart: unless-stopped
    command: python -m engine.queue_ingest_worker --loop
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    profiles: ["queue"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  syslog_collector:
    build: .
    restart: unless-stopped
    command: python -m collectors.syslog_server
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    ports:
      - "514:5140/udp"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # 1-bosqich: Parser (syslog -> devices/events, DNS blacklist tekshiruvi)
  # ---------------------------------------------------------------------
  parser_engine:
    build: .
    restart: unless-stopped
    command: python -m engine.parser_engine --loop --interval 5
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # 2-3-bosqich: Fayl hash tekshiruvi (VirusTotal/MalwareBazaar/mahalliy)
  # ---------------------------------------------------------------------
  file_analysis_engine:
    build: .
    restart: unless-stopped
    command: python -m engine.file_analysis_engine --loop --interval 10
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # 4-bosqich: Chuqur tekshiruv (YARA + ClamAV + Office + ZIP)
  # Suricata'ning file-store papkasi HOST'dan volume orqali beriladi
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # Suricata eve.json Reader - Suricata HOST'da (SPAN port bilan) alohida
  # ishlashi kerak (docs_SURICATA_SETUP.md'ga qarang). Bu xizmat FAQAT
  # host'dagi eve.json faylini o'qib, file_events jadvaliga yozadi -
  # Suricata'ning o'zi konteynerda EMAS.
  # ---------------------------------------------------------------------
  suricata_reader:
    build: .
    restart: unless-stopped
    command: python -m collectors.suricata_reader --file /var/log/suricata/eve.json
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    volumes:
      # Host'dagi Suricata eve.json faylini shu yerga bog'lang (Suricata
      # o'rnatilmagan/ishga tushirilmagan bo'lsa, bu xizmat shunchaki
      # faylni kutib turadi - xato bermaydi).
      - /var/log/suricata/eve.json:/var/log/suricata/eve.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  deep_scan_engine:
    build: .
    restart: unless-stopped
    command: python -m engine.deep_scan_engine --loop --interval 10
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
      CLAMAV_DB_DIR: /var/lib/clamav
      QUARANTINE_DIR: /var/lib/network-security/quarantine
    volumes:
      - clamav_db:/var/lib/clamav
      - quarantine_data:/var/lib/network-security/quarantine
      # Host'dagi Suricata file-store papkasini shu yerga bog'lang:
      - /var/log/suricata/files:/var/log/suricata/files:ro
    depends_on:
      postgres:
        condition: service_healthy
      clamav_updater:
        condition: service_started

  # ClamAV virus bazasini muntazam yangilab turuvchi alohida xizmat
  clamav_updater:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    entrypoint: >
      sh -c "freshclam --daemon --checks=12 --foreground=false;
             while true; do sleep 3600; freshclam --quiet || true; done"

  # ---------------------------------------------------------------------
  # 5-bosqich: Avtomatik javob choralari (UniFi/switch)
  # ---------------------------------------------------------------------
  response_engine:
    build: .
    restart: unless-stopped
    command: python -m engine.response_engine --loop --interval 5
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # 6-bosqich: Endpoint Agent API (Windows kompyuterlar shu yerga ulanadi)
  # ---------------------------------------------------------------------
  agent_api:
    build: .
    restart: unless-stopped
    command: gunicorn -w 4 -b 0.0.0.0:8443 api.server:app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    ports:
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # 7-bosqich: Bildirishnoma (Email/Telegram)
  # ---------------------------------------------------------------------
  notification_engine:
    build: .
    restart: unless-stopped
    command: python -m engine.notification_engine --loop --interval 10
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # MITRE ATT&CK belgilash
  # ---------------------------------------------------------------------
  mitre_tagging_engine:
    build: .
    restart: unless-stopped
    command: python -m engine.mitre_tagging_engine --loop --interval 15
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Web Dashboard
  # ---------------------------------------------------------------------
  dashboard:
    build: .
    restart: unless-stopped
    command: gunicorn -w 2 -b 0.0.0.0:8080 dashboard.app:app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Grafana (yangi TZ 12-bo'lim) - ixtiyoriy, --profile grafana orqali
  # ---------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:11.2.0
    restart: unless-stopped
    profiles: ["grafana"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json
      - grafana_data:/var/lib/grafana
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Network Discovery (yangi TZ 5-bo'lim) - ixtiyoriy, --profile discovery
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # UniFi Sync (standart holatda avtomatik ishlaydi - profil TALAB
  # QILINMAYDI, `network_discovery`dan farqli). Sabab: bu shunchaki
  # UniFi Controller'ga HTTPS API so'rovi - host tarmoq yoki maxsus
  # huquq (NET_ADMIN/NET_RAW) talab qilmaydi.
  # ---------------------------------------------------------------------
  unifi_sync:
    build: .
    restart: unless-stopped
    command: python -m network_discovery.unifi_sync_loop --loop --interval ${UNIFI_POLL_INTERVAL:-300}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  network_discovery:
    build: .
    restart: unless-stopped
    profiles: ["discovery"]
    # MUHIM: standart Docker tarmoq rejimida konteyner FAQAT Docker'ning
    # ichki bridge tarmog'ini (172.17.x/172.18.x) ko'radi, sizning
    # haqiqiy LAN'ingizni (masalan 172.16.0.0/22) emas - ARP scan va
    # LLDP/CDP capture noto'g'ri (yoki bo'sh) tarmoqni skanerlaydi.
    # `network_mode: host` konteynerni host'ning tarmoq nomfazosiga
    # to'g'ridan-to'g'ri ulaydi - host'dagi `ip addr`da ko'ringan barcha
    # interfeyslar (eth0 va h.k.) konteyner ichida ham xuddi shunday
    # ko'rinadi.
    network_mode: "host"
    cap_add:
      - NET_ADMIN   # ARP scan uchun
      - NET_RAW     # LLDP/CDP capture (raw socket) uchun
    command: >
      python -m network_discovery.scheduler
        --cidr ${DISCOVERY_CIDR:-172.16.0.0/22}
        --interface ${DISCOVERY_INTERFACE:-eth0}
        --loop --interval 3600
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-security_system}
      # MUHIM: network_mode:host'da konteyner "postgres" xizmat nomi
      # orqali topilmaydi (Docker DNS ishlamaydi) - shuning uchun
      # PostgreSQL'ning HOST'DAGI ochiq portiga (masalan 127.0.0.1 yoki
      # host'ning haqiqiy IP'siga) to'g'ridan-to'g'ri ulanish kerak.
      # `postgres` xizmatining `ports:` bo'limida 5432:5432 ochiq
      # bo'lishini ta'minlang.
    depends_on:
      postgres:
        condition: service_healthy
