volumes:
  postgres_data:
  clamav_db:
  grafana_data:
  quarantine_data:
  # Diqqat: Suricata odatda SPAN port orqali xom tarmoq trafigini o'qishi
  # kerak bo'lgani uchun konteynerdan tashqarida, host'da alohida ishlaydi
  # (docs_SURICATA_SETUP.md'ga qarang). Uning file-store papkasi
  # (/var/log/suricata/files) deep_scan_engine xizmatiga pastda bind-mount
  # orqali (named volume emas) bog'langan.

services:
  # ---------------------------------------------------------------------
  # Ma'lumotlar bazasi
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-security_system}
      POSTGRES_USER: ${POSTGRES_USER:-security_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida majburiy}
      # MUHIM: bu xizmat (rasmiy postgres image) `env_file: .env`
      # ishlatmaydi (faqat shu yerda aniq ko'rsatilgan o'zgaruvchilarni
      # oladi) - shuning uchun boshqa xizmatlarga qo'shilgan TZ o'zgaruvchisi
      # bu yerga avtomatik yetib bormaydi, alohida qo'shish kerak edi.
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      # Faqat 127.0.0.1'ga bog'langan (tashqi tarmoqqa OCHIQ EMAS) -
      # bu `network_discovery` xizmati kabi `network_mode: host`
      # konteynerlariga host orqali ulanish imkonini beradi.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-security_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # 0-bosqich: Syslog qabul qiluvchi (Kerio/switch/DNS forwarder shu yerga yuboradi)
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # Queue (yangi TZ 17-bo'lim) - yuqori yuklama uchun ixtiyoriy
  # ---------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # XAVFSIZLIK: standart RabbitMQ o'zi bilan keladigan "guest:guest"
      # foydalanuvchisi FAQAT localhost'dan kirishga ruxsat beradi -
      # lekin biz pastda 15672'ni tashqariga ochganimiz sabab (admin panel
      # kerak), "guest" hech qachon yetarli emas edi. Endi .env'da
      # majburiy, kuchli login/parol talab qilinadi.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER .env faylida majburiy}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD .env faylida majburiy}
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      # XAVFSIZLIK: 5672 (AMQP) endi TASHQARIGA UMUMAN OCHILMAYDI - faqat
      # Docker'ning ichki tarmog'idagi boshqa xizmatlar (`rabbitmq:5672`
      # nomi orqali) unga ulanadi, host portiga ehtiyoj yo'q. 15672
      # (Web boshqaruv paneli) esa faqat 127.0.0.1'ga bog'langan - LAN'ga
      # OCHIQ EMAS (kerak bo'lsa admin SSH tunnel/VPN orqali kiradi).
      - "127.0.0.1:15672:15672"  # faqat lokal admin panel
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Standart syslog_collector (yuqorida) o'rniga ishlatiladigan
  # navbat-asosli variant - juda yuqori UDP trafik kutilganda tavsiya
  # etiladi (docs_DOCKER_DEPLOYMENT.md'dagi "Kengaytirish" bo'limiga qarang)
  syslog_collector_queued:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m collectors.syslog_server_queued
    env_file: .env
    environment:
      # XAVFSIZLIK: standart "guest:guest" o'rniga rabbitmq xizmatiga
      # sozlangan haqiqiy login/parol ishlatiladi (yuqoridagi RABBITMQ_
      # USER/PASSWORD bilan bir xil).
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER .env faylida majburiy}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD .env faylida majburiy}@rabbitmq:5672/%2F
    ports:
      - "515:5140/udp"  # standart syslog_collector bilan bir vaqtda sinash uchun boshqa port
    profiles: ["queue"]  # standart holatda ishga tushmaydi: docker compose --profile queue up
    depends_on:
      rabbitmq:
        condition: service_healthy

  queue_ingest_worker:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m engine.queue_ingest_worker --loop
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
      # XAVFSIZLIK: standart "guest:guest" o'rniga rabbitmq xizmatiga
      # sozlangan haqiqiy login/parol ishlatiladi (yuqoridagi RABBITMQ_
      # USER/PASSWORD bilan bir xil).
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER .env faylida majburiy}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD .env faylida majburiy}@rabbitmq:5672/%2F
    profiles: ["queue"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  syslog_collector:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m collectors.syslog_server
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    ports:
      - "514:5140/udp"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # 1-bosqich: Parser (syslog -> devices/events, DNS blacklist tekshiruvi)
  # ---------------------------------------------------------------------
  parser_engine:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m engine.parser_engine --loop --interval 5
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # 11-bo'lim: UEBA/AI - anomaliya aniqlash + Risk Score
  # ---------------------------------------------------------------------
  # MUHIM (real production'da aniqlangan bo'shliq - loyihada bir necha
  # marta uchragan "kod to'g'ri, lekin hech kim uni ishga tushirmaydi"
  # xato turkumi): engine/ueba_engine.py to'liq yozilgan va test
  # qilingan edi, lekin bu yerda HECH QANDAY xizmat sifatida
  # ro'yxatga olinmagan edi - shuning uchun baseline/anomaliya/risk
  # score hech qachon HAQIQIY ishga tushmagan, garchi events jadvali
  # yuz minglab yozuv bilan to'lib turgan bo'lsa ham (Alertlar bo'sh
  # qolishining bir sababi).
  ueba_engine:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m engine.ueba_engine --loop --interval 300
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # 2-3-bosqich: Fayl hash tekshiruvi (VirusTotal/MalwareBazaar/mahalliy)
  # ---------------------------------------------------------------------
  file_analysis_engine:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m engine.file_analysis_engine --loop --interval 10
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # 4-bosqich: Chuqur tekshiruv (YARA + ClamAV + Office + ZIP)
  # Suricata'ning file-store papkasi HOST'dan volume orqali beriladi
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # Suricata eve.json Reader - Suricata HOST'da (SPAN port bilan) alohida
  # ishlashi kerak (docs_SURICATA_SETUP.md'ga qarang). Bu xizmat FAQAT
  # host'dagi eve.json faylini o'qib, file_events jadvaliga yozadi -
  # Suricata'ning o'zi konteynerda EMAS.
  # ---------------------------------------------------------------------
  suricata_reader:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m collectors.suricata_reader --file /var/log/suricata/eve.json
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    volumes:
      # Host'dagi Suricata eve.json faylini shu yerga bog'lang (Suricata
      # o'rnatilmagan/ishga tushirilmagan bo'lsa, bu xizmat shunchaki
      # faylni kutib turadi - xato bermaydi).
      - /var/log/suricata/eve.json:/var/log/suricata/eve.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  deep_scan_engine:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m engine.deep_scan_engine --loop --interval 10
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
      CLAMAV_DB_DIR: /var/lib/clamav
      # clamd (doimiy jarayon, `clamav_updater` ichida) - bor bo'lsa BIRINCHI ishlatiladi (baza
      # xotirada oldindan yuklangan, `clamscan` CLI'dan sezilarli tezroq); clamd javob bermasa
      # yuqoridagi `CLAMAV_DB_DIR` + `clamscan` CLI zaxira sifatida ishlaydi.
      CLAMD_HOST: clamav_updater
      CLAMD_PORT: "3310"
      QUARANTINE_DIR: /var/lib/network-security/quarantine
    volumes:
      - clamav_db:/var/lib/clamav
      - quarantine_data:/var/lib/network-security/quarantine
      # Host'dagi Suricata file-store papkasini shu yerga bog'lang:
      - /var/log/suricata/files:/var/log/suricata/files:ro
    depends_on:
      postgres:
        condition: service_healthy
      clamav_updater:
        condition: service_started

  # ClamAV: baza yangilash (freshclam) VA doimiy skanerlash daemoni (clamd) - rasmiy image'ning
  # standart ishga tushirish tartibi (ikkalasini ham fon jarayoni sifatida boshlaydi). clamd
  # TCP 3310'da ICHKI docker tarmog'ida tinglaydi (hostga OCHIQ EMAS - `ports:` yo'q, faqat
  # boshqa xizmatlar konteyner nomi orqali murojaat qiladi). Boshqa xizmatlar (deep_scan_engine/
  # agent_api) clamd javob bermasa avvalgi `clamscan` CLI'ga avtomatik qaytadi - bu xizmat
  # to'xtab qolsa ham chuqur tekshiruv butunlay to'xtamaydi.
  clamav_updater:
    image: clamav/clamav:stable
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # XAVFSIZLIK/BARQARORLIK (real production'da topilgan xato): `clamd` to'liq imzo bazasini
    # (main.cvd+daily.cvd, ~3.6 million imzo) xotiraga yuklab, doimiy ~940MB (1GB chegaraning
    # 92%) ishlatadi - bu FAQAT muvozanatli holat. `freshclam` bazani yangilab, `clamd`ga
    # qayta yuklashni buyurganda (odatda kuniga bir necha marta) ESKI VA YANGI nusxa BIR VAQTDA
    # xotirada bo'ladi - 1GB chegara YETARLI EMAS edi: qayta yuklash muvaffaqiyatsiz tugab,
    # `clamd` jarayoni "tirik" ko'rinsa-da (ps'da bor), TCP 3310 tinglovchisi jimgina o'chib
    # qolgan (`agent_api`/`deep_scan_engine` clamd bilan ~20 soat ulanolmagan, sezilmasdan
    # `clamscan` CLI'ga - yoki `agent_api`da hech narsaga - qaytgan). Xotira 2g'ga oshirildi.
    mem_limit: 2g
    environment:
      TZ: ${TZ:-Asia/Tashkent}
      FRESHCLAM_CHECKS: "12"
    volumes:
      - clamav_db:/var/lib/clamav

  # ---------------------------------------------------------------------
  # 5-bosqich: Avtomatik javob choralari (UniFi/switch)
  # ---------------------------------------------------------------------
  response_engine:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m engine.response_engine --loop --interval 5
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # 6-bosqich: Endpoint Agent API (Windows kompyuterlar shu yerga ulanadi)
  # ---------------------------------------------------------------------
  agent_api:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    command: gunicorn -w 4 --timeout 150 -b 0.0.0.0:8443 api.server:app
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
      # clamd - agentdan yuklangan namunalarni (`api/server.py::scan_file_upload`) ClamAV bilan
      # ham tekshirish uchun. Bu konteynerda `CLAMAV_DB_DIR`/umumiy volume YO'Q (avval shu sabab
      # ClamAV bosqichi HAR DOIM "baza topilmadi" bilan o'tkazib yuborilardi - real bo'shliq) -
      # clamd tarmoq orqali (INSTREAM) ishlagani uchun umumiy volume shart emas.
      CLAMD_HOST: clamav_updater
      CLAMD_PORT: "3310"
    ports:
      # Standart: LAN'ga to'g'ridan-to'g'ri ochiq (0.0.0.0) - `nginx` TLS
      # proxy hali production'da ATAYLAB ishga tushirilmagan (sertifikat
      # yo'q, mavjud agentlar hamon oddiy HTTP orqali ulanadi). TLS'ga
      # o'tishga tayyor bo'lganingizda (`docs_TLS_SETUP.md`), `.env`ga
      # `AGENT_API_HOST_IP=127.0.0.1` qo'shing va `nginx`ni ishga tushiring.
      - "${AGENT_API_HOST_IP:-0.0.0.0}:8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      clamav_updater:
        condition: service_started

  # ---------------------------------------------------------------------
  # 7-bosqich: Bildirishnoma (Email/Telegram)
  # ---------------------------------------------------------------------
  notification_engine:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m engine.notification_engine --loop --interval 10
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Agent "qayta ulanishga urinish" so'rovlarining 60s muddatini kuzatish
  # (ulanmasa - Alert -> Telegram/Email)
  # ---------------------------------------------------------------------
  agent_restart_monitor:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    command: python -m engine.agent_restart_monitor --loop --interval 5
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # MITRE ATT&CK belgilash
  # ---------------------------------------------------------------------
  mitre_tagging_engine:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m engine.mitre_tagging_engine --loop --interval 15
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Correlation Engine - alohida alertlarni bitta Incident'ga birlashtiradi
  # ---------------------------------------------------------------------
  correlation_engine:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m engine.correlation_engine --loop --interval 15
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Web Dashboard
  # ---------------------------------------------------------------------
  dashboard:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    # 2 ta sinxron worker + 30s timeout: bitta sekin so'rov butun Dashboard'ni
    # bloklab, worker o'ldirilardi. Endi 3 worker x 4 thread, 120s timeout va
    # access log (500/timeout sabablarini keyin topish uchun).
    command: gunicorn -w 3 --threads 4 --timeout 120 --access-logfile - -b 0.0.0.0:8080 dashboard.app:app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    ports:
      # Standart: LAN'ga to'g'ridan-to'g'ri ochiq (0.0.0.0) - `nginx` TLS
      # proxy hali production'da ATAYLAB ishga tushirilmagan. TLS'ga
      # o'tishga tayyor bo'lganingizda (`docs_TLS_SETUP.md`), `.env`ga
      # `DASHBOARD_HOST_IP=127.0.0.1` qo'shing va `nginx`ni ishga tushiring.
      - "${DASHBOARD_HOST_IP:-0.0.0.0}:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # TLS reverse proxy (xavfsizlik auditi - CRITICAL: HTTPS + Internal CA)
  # ---------------------------------------------------------------------
  # agent_api va dashboard o'zlari oddiy HTTP orqali ishlaydi (yuqorida,
  # faqat 127.0.0.1'ga bog'langan - LAN'ga OCHIQ EMAS). TLS termination
  # FAQAT shu yerda, nginx'da bajariladi - haqiqiy tarmoq trafigi
  # (Windows/Linux/Mac Agent'lar, Dashboard brauzerlari) endi HAR DOIM
  # shifrlangan. Sertifikatlar `deploy/pki/generate_ca.sh` orqali
  # yaratiladigan ichki CA bilan imzolanadi (docs_TLS_SETUP.md'ga qarang).
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # MUHIM (real production'da aniqlangan xato): bu xizmat profilsiz
    # bo'lgani uchun har bir oddiy `docker compose up -d`da ishga
    # tushishga urinardi - lekin foydalanuvchi ATAYLAB oddiy http://
    # (TLS'siz) qolishni tanlagan (agent_api/dashboard 8443/8080 portlarini
    # to'g'ridan-to'g'ri LAN'ga ochadi), shuning uchun nginx HAR DOIM
    # xuddi shu 8443 portini band qilishga urinib, "port is already
    # allocated" xatosi bilan muvaffaqiyatsiz bo'lardi (zararsiz, lekin
    # har safar chalg'ituvchi xato). Endi TLS'ga (docs_TLS_SETUP.md)
    # o'tishga tayyor bo'lganingizda: `docker compose --profile tls up -d`.
    profiles: ["tls"]
    volumes:
      - ./deploy/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./deploy/nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./deploy/pki/certs:/etc/nginx/tls:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      NGINX_AGENT_API_PORT: "8443"
      NGINX_DASHBOARD_PORT: "8843"
      NGINX_TLS_CERT_FILE: /etc/nginx/tls/server.crt
      NGINX_TLS_KEY_FILE: /etc/nginx/tls/server.key
      NGINX_TLS_CA_FILE: /etc/nginx/tls/ca.crt
      # XAVFSIZLIK (ixtiyoriy, standart o'chiq): "true" qilinsa, Agent
      # API endi HAR BIR so'rovda CA tomonidan imzolangan client
      # sertifikat (mTLS) talab qiladi - docs_TLS_SETUP.md'ga qarang.
      AGENT_MTLS_REQUIRED: ${AGENT_MTLS_REQUIRED:-false}
    ports:
      - "8443:8443"   # Agent API (TLS) - LAN'ga OCHIQ (172.16.0.0/22)
      - "8843:8843"   # Dashboard (TLS) - LAN'ga OCHIQ
    depends_on:
      - agent_api
      - dashboard

  # ---------------------------------------------------------------------
  # Grafana (yangi TZ 12-bo'lim) - ixtiyoriy, --profile grafana orqali
  # ---------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:11.2.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles: ["grafana"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # XAVFSIZLIK: standart qiymat ("admin") olib tashlandi - ilgari
      # GRAFANA_ADMIN_PASSWORD .env'da sozlanmasa, Grafana taniqli
      # admin/admin login bilan ochiq qolardi. Endi .env'da majburiy.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD .env faylida majburiy}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json
      - grafana_data:/var/lib/grafana
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Network Discovery (yangi TZ 5-bo'lim) - ixtiyoriy, --profile discovery
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # UniFi Sync (standart holatda avtomatik ishlaydi - profil TALAB
  # QILINMAYDI, `network_discovery`dan farqli). Sabab: bu shunchaki
  # UniFi Controller'ga HTTPS API so'rovi - host tarmoq yoki maxsus
  # huquq (NET_ADMIN/NET_RAW) talab qilmaydi.
  # ---------------------------------------------------------------------
  unifi_sync:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m network_discovery.unifi_sync_loop --loop --interval ${UNIFI_POLL_INTERVAL:-300}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # Ruijie Cloud discovery - unifi_sync bilan bir xil naqsh (shunchaki
  # HTTPS API so'rovi, host tarmoq/maxsus huquq shart emas) - shuning
  # uchun profilsiz, standart `docker compose up -d` bilan avtomatik
  # ishga tushadi. RUIJIE_APP_ID sozlanmagan bo'lsa zararsiz jim turadi.
  ruijie_sync:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m network_discovery.ruijie_sync_loop --loop --interval ${RUIJIE_POLL_INTERVAL:-300}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  # Threat Intelligence (URLhaus/ThreatFox) - unifi_sync/ruijie_sync bilan
  # bir xil naqsh: shunchaki HTTPS API so'rovi, host tarmoq/maxsus huquq
  # shart emas - profilsiz, standart holatda ishga tushadi. URLHAUS_AUTH_
  # KEY/THREATFOX_AUTH_KEY sozlanmagan bo'lsa mos feed zararsiz jim turadi.
  threat_intel_sync:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: python -m engine.threat_intel_sync --loop --interval ${THREAT_INTEL_POLL_INTERVAL:-3600}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_system}
    depends_on:
      postgres:
        condition: service_healthy

  network_discovery:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    # XAVFSIZLIK ISTISNOSI: Dockerfile standart holatda non-root
    # (appuser, uid 1000)ga o'tkazildi, lekin bu xizmat ARP scan/
    # LLDP-CDP capture uchun NET_ADMIN/NET_RAW capability'ga
    # tayanadi - bu amalda root kontekstida ishonchli ishlaydi.
    # Shuning uchun ANIQ ravishda root'ga qaytariladi. Allaqachon
    # `--profile discovery` ortida, standart holatda o'chiq.
    user: "0:0"
    profiles: ["discovery"]
    # MUHIM: standart Docker tarmoq rejimida konteyner FAQAT Docker'ning
    # ichki bridge tarmog'ini (172.17.x/172.18.x) ko'radi, sizning
    # haqiqiy LAN'ingizni (masalan 172.16.0.0/22) emas - ARP scan va
    # LLDP/CDP capture noto'g'ri (yoki bo'sh) tarmoqni skanerlaydi.
    # `network_mode: host` konteynerni host'ning tarmoq nomfazosiga
    # to'g'ridan-to'g'ri ulaydi - host'dagi `ip addr`da ko'ringan barcha
    # interfeyslar (eth0 va h.k.) konteyner ichida ham xuddi shunday
    # ko'rinadi.
    network_mode: "host"
    cap_add:
      - NET_ADMIN   # ARP scan uchun
      - NET_RAW     # LLDP/CDP capture (raw socket) uchun
    command: >
      python -m network_discovery.scheduler
        --cidr ${DISCOVERY_CIDR:-172.16.0.0/22}
        --interface ${DISCOVERY_INTERFACE:-eth0}
        --loop --interval 3600
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-security_admin}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-security_system}
      # MUHIM: network_mode:host'da konteyner "postgres" xizmat nomi
      # orqali topilmaydi (Docker DNS ishlamaydi) - shuning uchun
      # PostgreSQL'ning HOST'DAGI ochiq portiga (masalan 127.0.0.1 yoki
      # host'ning haqiqiy IP'siga) to'g'ridan-to'g'ri ulanish kerak.
      # `postgres` xizmatining `ports:` bo'limida 127.0.0.1:5432 ochiq
      # bo'lishini ta'minlang.
    depends_on:
      postgres:
        condition: service_healthy
