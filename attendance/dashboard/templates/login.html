{% extends "base.html" %}
{% block title %}Kirish - Davomat Dashboard{% endblock %}
{% block content %}
<div class="card" style="max-width: 360px; margin: 60px auto;">
    <h1>Kirish</h1>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label style="display:block; margin-bottom: 10px; font-size: 12px; color: #5a6673;">
            Login
            <input type="text" name="username" required style="width:100%; padding:8px; margin-top:4px; border:1px solid #dde3e8; border-radius:4px;">
        </label>
        <label style="display:block; margin-bottom: 14px; font-size: 12px; color: #5a6673;">
            Parol
            <input type="password" name="password" required style="width:100%; padding:8px; margin-top:4px; border:1px solid #dde3e8; border-radius:4px;">
        </label>
        <button type="submit" style="width:100%; padding:10px; background:#123524; color:#fff; border:none; border-radius:4px; cursor:pointer;">Kirish</button>
    </form>
</div>
{% endblock %}
