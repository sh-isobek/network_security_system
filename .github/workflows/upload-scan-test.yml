name: Upload lifecycle tests
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  upload-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: upload_test
          POSTGRES_USER: upload_test
          POSTGRES_PASSWORD: upload_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt psycopg2-binary pyyaml
      - name: Lifecycle tests
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://upload_test:upload_test@localhost:5432/upload_test' || 'sqlite:///logs/upload_test.db' }}
          AGENT_LOG_FILE: agent.log
        run: python -m unittest test_upload_scan -v
      - name: Deployment YAML
        run: |
          python -c "import yaml; from pathlib import Path; [list(yaml.safe_load_all(p.read_text())) for p in [Path('docker-compose.yml'), *Path('k8s').glob('*.yaml')]]"
