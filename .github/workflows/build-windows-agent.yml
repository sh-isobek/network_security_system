name: Build Windows Agent

# Windows Agent'ni haqiqiy Windows muhitida (GitHub'ning windows-latest
# runner'i) .exe fayliga aylantiradi - bu Linux sandbox'da mumkin
# bo'lmagan yagona real test yo'li (Wine emas, haqiqiy Windows).

on:
  push:
    branches: [main]
    paths:
      - "windows_agent/**"
      - "agent_core/**"
      - "requirements-agent.txt"
      - "deploy/windows_agent_gpo/**"
      - ".github/workflows/build-windows-agent.yml"
  workflow_dispatch: {}   # qo'lda ham ishga tushirish mumkin

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bog'liqliklarni o'rnatish
        run: |
          pip install -r requirements-agent.txt
          pip install pyinstaller

      - name: .exe qurish (PyInstaller)
        run: |
          pyinstaller windows_agent/build/NetworkSecurityAgent.spec --distpath dist --workpath build/pyinstaller-work

      - name: .exe haqiqatan yaratilganini tekshirish
        run: |
          if (-not (Test-Path "dist/NetworkSecurityAgent.exe")) {
            Write-Error ".exe fayli yaratilmadi!"
            exit 1
          }
          $size = (Get-Item "dist/NetworkSecurityAgent.exe").Length
          Write-Host "NetworkSecurityAgent.exe yaratildi: $size bayt"
          if ($size -lt 1000000) {
            Write-Error ".exe fayli shubhali kichik ($size bayt) - to'liq qurilmagan bo'lishi mumkin"
            exit 1
          }

      - name: .exe'ning haqiqatan ishga tushishini tekshirish (--help)
        run: |
          # Haqiqiy Windows binary'ni ishga tushirib, kamida chaqirilishini
          # (crash bo'lmasligini) tasdiqlaymiz. pywin32 xizmat wrapper'lari
          # argumentsiz chaqirilganda odatda foydalanish (usage) xabarini
          # chiqarib, muvaffaqiyatli chiqadi.
          $proc = Start-Process -FilePath "dist/NetworkSecurityAgent.exe" -ArgumentList "--help" -NoNewWindow -PassThru -Wait -RedirectStandardOutput "help_output.txt" -RedirectStandardError "help_error.txt"
          Write-Host "Exit kod: $($proc.ExitCode)"
          Get-Content help_output.txt, help_error.txt -ErrorAction SilentlyContinue

      - name: Windows Service ro'yxatdan o'tishini tekshirish
        shell: powershell
        run: |
          # MUHIM: bu qadam aynan real production'da topilgan xatoni
          # (xizmat "muvaffaqiyatli o'rnatildi" deb log qilingan, lekin
          # SCM'da HAQIQATAN topilmagan) avtomatik ravishda, HAR PUSH'DA
          # ushlab turadi - haqiqiy Windows runner'da, haqiqiy Service
          # Control Manager orqali.
          $out = & "dist/NetworkSecurityAgent.exe" --startup manual install 2>&1
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Service install failed: exit code $LASTEXITCODE"
            exit 1
          }
          sc.exe query NetworkSecurityEndpointAgent
          if ($LASTEXITCODE -ne 0) {
            Write-Error "NetworkSecurityEndpointAgent SCM'da topilmadi"
            exit 1
          }

      - name: Windows Service HAQIQATAN ishga tushishini tekshirish (Start-Service)
        shell: powershell
        run: |
          # MUHIM: yuqoridagi qadam faqat REGISTRATSIYANI tekshiradi
          # (sc.exe query) - bu xizmat HAQIQATAN "Running" holatiga
          # o'ta olishini KAFOLATLAMAYDI. Real production'da aynan shu
          # farq katta muammoga sabab bo'ldi: xizmat to'g'ri ro'yxatga
          # olingan, lekin Start-Service "Cannot start service" bilan
          # muvaffaqiyatsiz bo'lgan (SCM Control Dispatcher bilan
          # bog'liq, PyInstaller+pywin32'ga xos muammo). Shuning uchun
          # bu yerda HAQIQIY Start-Service chaqirilib, xizmat holati
          # "Running"ga o'tishi TASDIQLANADI - bu bizning butun
          # muammoni HAR PUSH'DA, foydalanuvchi production'da sinamasdan
          # OLDIN avtomatik ushlaydi.
          try {
            Start-Service -Name NetworkSecurityEndpointAgent -ErrorAction Stop
            Start-Sleep -Seconds 5
            $svc = Get-Service -Name NetworkSecurityEndpointAgent -ErrorAction Stop
            Write-Host "Xizmat holati: $($svc.Status)"
            if ($svc.Status -ne "Running") {
              Write-Error "Xizmat ishga tushdi, lekin holati '$($svc.Status)' (Running emas)"
              exit 1
            }
            Write-Host "✅ Xizmat HAQIQATAN 'Running' holatiga o'tdi"
          } catch {
            Write-Error "Start-Service muvaffaqiyatsiz: $_"
            Get-WinEvent -LogName System -MaxEvents 5 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -eq "Service Control Manager" } |
              Format-List TimeCreated, Message
            exit 1
          } finally {
            Stop-Service -Name NetworkSecurityEndpointAgent -ErrorAction SilentlyContinue
            & "dist/NetworkSecurityAgent.exe" remove
          }

      - name: Versiyani o'qish (release nomlash uchun)
        id: version
        run: |
          $version = Get-Content windows_agent/VERSION -Raw
          $version = $version.Trim()
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "AGENT_VERSION=$version"

      - name: Release paketini yig'ish (exe + o'rnatuvchi + VERSION)
        run: |
          $releaseDir = "release/NetworkSecurityAgent"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item "dist/NetworkSecurityAgent.exe" -Destination $releaseDir
          Copy-Item "windows_agent/VERSION" -Destination $releaseDir
          Copy-Item "deploy/windows_agent_gpo/Deploy-NetworkSecurityAgent.ps1" -Destination $releaseDir
          Copy-Item "deploy/windows_agent_gpo/Install-NetworkSecurityAgent.ps1" -Destination $releaseDir -ErrorAction SilentlyContinue
          Compress-Archive -Path $releaseDir -DestinationPath "NetworkSecurityAgent-$($env:AGENT_VERSION).zip" -Force
        env:
          AGENT_VERSION: ${{ steps.version.outputs.version }}

      - name: Artifact sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: NetworkSecurityAgent-${{ steps.version.outputs.version }}
          path: NetworkSecurityAgent-*.zip
          retention-days: 90
