[alembic]
# Migratsiya fayllari qayerda saqlanadi
script_location = alembic

# sqlalchemy.url ATAYLAB shu yerda YOZILMAGAN - alembic/env.py uni
# config/settings.py'dagi DATABASE_URL'dan dinamik o'qiydi (loyihaning
# boshqa barcha modullari bilan bir xil yagona manba - .env/muhit
# o'zgaruvchisi orqali SQLite yoki PostgreSQL, kod o'zgarmaydi).

[post_write_hook]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
